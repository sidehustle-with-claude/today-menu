<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 뭐 먹지</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #fafaf7; color: #222; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .hint { margin: 0 0 16px; color: #555; }
    input { width: 100%; height: 44px; padding: 0 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
    .menus { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 20px; }
    .menus button { height: 44px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
    .card { background: #fff; border: 1px solid #e5e5e0; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .card h2 { font-size: 18px; margin: 0 0 4px; }
    .card p { margin: 0; color: #555; }
    .card { position: relative; }
    .star { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; font-size: 22px; border: 0; background: none; color: #bbb; cursor: pointer; }
    .star[aria-pressed="true"] { color: #e8a200; }
  </style>
</head>
<body>
  <main>
    <h1>오늘 뭐 먹지</h1>
    <p class="hint">동네와 메뉴를 고르면 오늘 갈 만한 곳 3곳을 골라 드려요.</p>
    <input type="text" placeholder="동네 이름을 넣어 주세요" aria-label="동네 이름">
    <div class="menus">
      <button type="button">한식</button>
      <button type="button">분식</button>
      <button type="button">카페</button>
      <button type="button">중식</button>
    </div>
    <section>
      <article class="card"><h2>가게 이름 1</h2><p>한 줄 이유</p><button type="button" class="star" aria-pressed="false" aria-label="즐겨찾기">★</button></article>
      <article class="card"><h2>가게 이름 2</h2><p>한 줄 이유</p><button type="button" class="star" aria-pressed="false" aria-label="즐겨찾기">★</button></article>
      <article class="card"><h2>가게 이름 3</h2><p>한 줄 이유</p><button type="button" class="star" aria-pressed="false" aria-label="즐겨찾기">★</button></article>
    </section>
  </main>
  <script>
    // 즐겨찾기: 가게 이름을 localStorage의 favorites 배열에 저장한다. 저장이 막힌 브라우저에서도 화면은 깨지지 않는다.
    var KEY = "favorites";
    function readFavorites() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
    }
    function writeFavorites(list) {
      try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
    }
    function paint() {
      var favs = readFavorites();
      document.querySelectorAll(".card").forEach(function (card) {
        var name = card.querySelector("h2").textContent;
        card.querySelector(".star").setAttribute("aria-pressed", favs.indexOf(name) >= 0 ? "true" : "false");
      });
    }
    document.querySelectorAll(".card").forEach(function (card) {
      card.querySelector(".star").addEventListener("click", function () {
        var name = card.querySelector("h2").textContent;
        var favs = readFavorites();
        var i = favs.indexOf(name);
        if (i >= 0) favs.splice(i, 1); else favs.push(name);
        writeFavorites(favs);
        paint();
      });
    });
    paint();
  </script>
</body>
</html>
