<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 뭐 먹지</title>
  <style>
    /* 값은 DESIGN.md 에서만 가져온다. */
    :root {
      --bg: #ffffff;
      --text: #1f2933;
      --muted: #6b7785;
      --accent: #e8590c;
      --line: #e4e7eb;
      --radius: 12px;
      --s1: 8px;
      --s2: 16px;
      --s3: 24px;
      --s4: 32px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; background: var(--bg); color: var(--text); }
    main { max-width: 480px; margin: 0 auto; padding: var(--s3) var(--s2); }
    h1 { font-size: 24px; margin: 0 0 var(--s1); }
    .hint { margin: 0 0 var(--s2); color: var(--muted); font-size: 13px; }
    input { width: 100%; height: 48px; padding: 0 var(--s2); font: inherit; color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); }
    .menus { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s1); margin: var(--s2) 0 var(--s3); }
    .menus button { height: 48px; font: inherit; color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); cursor: pointer; }
    .menus button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    #cards { border-top: 1px solid var(--line); }
    .card { position: relative; padding: var(--s2) 56px var(--s2) 0; border-bottom: 1px solid var(--line); }
    .card h2 { font-size: 16px; margin: 0 0 var(--s1); }
    .card p { margin: 0; color: var(--muted); font-size: 13px; }
    .star { position: absolute; top: 50%; right: 0; transform: translateY(-50%); width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; background: none; color: var(--line); cursor: pointer; }
    .star svg { width: 24px; height: 24px; fill: currentColor; }
    .star[aria-pressed="true"] { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>오늘 뭐 먹지</h1>
    <p class="hint">동네와 메뉴를 고르면 오늘 갈 만한 곳 3곳을 골라 드려요.</p>
    <input id="area" type="text" placeholder="동네 이름을 넣어 주세요" aria-label="동네 이름">
    <div class="menus">
      <button type="button">한식</button>
      <button type="button">분식</button>
      <button type="button">카페</button>
      <button type="button">중식</button>
    </div>
    <section id="cards" aria-live="polite"></section>
  </main>
  <script>
    // 데이터는 public/data/restaurants.json (가상 데이터). file:// 로 열면 fetch가 막히니 로컬 서버로 연다 (예: 저장소 루트에서 python3 -m http.server 8000).
    var KEY = "favorites";
    var STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>';
    var restaurants = [];
    var category = "";

    // 예제 12-1: 즐겨찾기 읽기와 쓰기
    function readFavorites() {
      try {
        return JSON.parse(localStorage.getItem(KEY)) ?? [];
      } catch {
        return [];
      }
    }

    function toggleFavorite(id) {
      var now = readFavorites();
      var next = now.includes(id)
        ? now.filter(function (x) { return x !== id; })
        : [].concat(now, [id]);
      try {
        localStorage.setItem(KEY, JSON.stringify(next));
      } catch {}
      return next;
    }

    function pick(list, n) {
      var copy = list.slice();
      var out = [];
      while (copy.length && out.length < n) {
        out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
      }
      return out;
    }

    function render() {
      var area = document.getElementById("area").value.trim();
      var list = restaurants.filter(function (r) {
        return (!area || r.area.indexOf(area) >= 0) && (!category || r.category === category);
      });
      var favs = readFavorites();
      var box = document.getElementById("cards");
      box.innerHTML = "";
      if (!list.length) {
        box.textContent = "조건에 맞는 가게가 없어요. 동네나 메뉴를 바꿔 보세요.";
        return;
      }
      pick(list, 3).forEach(function (r) {
        var card = document.createElement("article");
        card.className = "card";
        card.dataset.id = r.id;
        var h2 = document.createElement("h2");
        h2.textContent = r.name;
        var p = document.createElement("p");
        p.textContent = r.area + " · " + r.category + " · " + r.hours;
        var star = document.createElement("button");
        star.type = "button";
        star.className = "star";
        star.setAttribute("aria-label", "즐겨찾기");
        star.setAttribute("aria-pressed", favs.includes(r.id) ? "true" : "false");
        star.innerHTML = STAR_SVG;
        star.addEventListener("click", function () {
          var next = toggleFavorite(r.id);
          star.setAttribute("aria-pressed", next.includes(r.id) ? "true" : "false");
        });
        card.append(h2, p, star);
        box.appendChild(card);
      });
    }

    document.querySelectorAll(".menus button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        category = category === btn.textContent ? "" : btn.textContent;
        document.querySelectorAll(".menus button").forEach(function (b) {
          b.setAttribute("aria-pressed", b.textContent === category ? "true" : "false");
        });
        render();
      });
    });
    document.getElementById("area").addEventListener("input", render);

    fetch("public/data/restaurants.json")
      .then(function (res) { return res.json(); })
      .then(function (data) { restaurants = data; render(); })
      .catch(function () {
        document.getElementById("cards").textContent = "가게 목록을 불러오지 못했어요. 로컬 서버로 열었는지 확인하세요.";
      });
  </script>
</body>
</html>
