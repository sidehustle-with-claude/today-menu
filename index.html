<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 뭐 먹지</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #fafaf7; color: #222; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    input { width: 100%; height: 44px; padding: 0 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
    .menus { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 20px; }
    .menus button { height: 44px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
    .card { background: #fff; border: 1px solid #e5e5e0; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .card h2 { font-size: 18px; margin: 0 0 4px; }
    .card p { margin: 0; color: #555; }
  </style>
</head>
<body>
  <main>
    <h1>오늘 뭐 먹지</h1>
    <input type="text" placeholder="동네 이름을 넣어 주세요" aria-label="동네 이름">
    <div class="menus">
      <button type="button">한식</button>
      <button type="button">분식</button>
      <button type="button">카페</button>
      <button type="button">중식</button>
    </div>
    <section>
      <article class="card"><h2>가게 이름</h2><p>한 줄 이유</p></article>
      <article class="card"><h2>가게 이름</h2><p>한 줄 이유</p></article>
      <article class="card"><h2>가게 이름</h2><p>한 줄 이유</p></article>
    </section>
  </main>
</body>
</html>
