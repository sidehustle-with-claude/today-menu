name: check
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 확인
        run: npm run typecheck
      - name: 테스트
        run: npm test
      - name: 빌드
        run: npm run build
